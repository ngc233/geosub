<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>指南列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F3}
a{color:#15171A}
.num{font-family:"Inter Tight",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.ghost{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #D9D9D3;background:#FFFFFF;color:#15171A;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform 120ms cubic-bezier(0.2,0.8,0.2,1),background-color 120ms}
.ghost:hover{background:#F0F0EC}
.tab{min-height:44px;padding:0 14px;border:0;background:transparent;font:inherit;font-size:14px;color:#5B616B;cursor:pointer;position:relative;z-index:1;white-space:nowrap;transition:color 220ms cubic-bezier(0.2,0.8,0.2,1)}
.tab[aria-pressed="true"]{color:#1A2E05;font-weight:700}
.card{background:#FFFFFF;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:#15171A;height:196px;box-sizing:border-box;transition:transform 120ms cubic-bezier(0.2,0.8,0.2,1),box-shadow 120ms cubic-bezier(0.2,0.8,0.2,1)}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(21,23,26,0.08);color:#15171A}
.card:active{transform:scale(0.98)}
.step{flex:1 1 0;min-width:0;display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;background:#FFFFFF;text-decoration:none;color:#15171A;transition:transform 120ms cubic-bezier(0.2,0.8,0.2,1),box-shadow 120ms cubic-bezier(0.2,0.8,0.2,1)}
.step:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(21,23,26,0.08);color:#15171A}
.tab:focus-visible,.card:focus-visible,.step:focus-visible,.ghost:focus-visible{outline:3px solid #4D7C0F;outline-offset:2px}
@keyframes rise0{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes rise1{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.rise0{animation:rise0 320ms cubic-bezier(0.2,0.8,0.2,1) both}
.rise1{animation:rise1 320ms cubic-bezier(0.2,0.8,0.2,1) both}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F6F3; color: #15171A; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">

<header style="background: rgba(246,246,243,0.92); border-bottom: 1px solid #E4E4DF">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; min-height: 64px; display: flex; align-items: center; gap: 16px">
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #15171A; min-height: 44px"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#15171A"></circle><path d="M2 14h24M14 2c4 4 4 20 0 24M14 2c-4 4-4 20 0 24" fill="none" stroke="#3D4450" stroke-width="1.5"></path><circle cx="21" cy="8" r="4" fill="#A3E635" stroke="#F6F6F3" stroke-width="1.5"></circle></svg><span style="font-size: 19px; font-weight: 700">GeoSub</span></a>
<nav aria-label="主导航" style="display: flex; flex-grow: 1; gap: 4px; font-size: 15px">
<a href="#h" style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; text-decoration: none; color: #5B616B">首页</a>
<a href="#p" style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; text-decoration: none; color: #5B616B">按产品</a>
<a href="#c" style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; text-decoration: none; color: #5B616B">按国家</a>
<a href="#g" aria-current="page" style="min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; text-decoration: none; color: #15171A; font-weight: 600; box-shadow: inset 0 -3px 0 #84CC16">指南</a>
</nav>
<label style="flex: 0 1 300px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: #FFFFFF; border: 1px solid #E4E4DF; border-radius: 12px; color: #5B616B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="search" placeholder="搜产品或国家" aria-label="搜索" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px"><kbd class="num" style="font-size: 12px; color: #5B616B; border: 1px solid #E4E4DF; border-radius: 6px; padding: 1px 6px">/</kbd></label>
<button type="button" class="ghost"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>简体中文</button>
</div>
</header>

<main id="top" style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-direction: column; gap: 36px">
<section style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 40px; font-weight: 700">指南</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3D4450; max-width: 640px">买外区订阅之前，先把<b style="color: #15171A">账号、付款和套餐差别</b>弄清楚。每篇都写明适用地区和更新日期。</p>
</section>

<section style="background: #F7FEE7; border: 1px solid #D9F99D; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-size: 20px; font-weight: 700">第一次买外区订阅？按这三步来</h2><span style="font-size: 13px; color: #3F6212">合计约 12 分钟</span></div>
<div style="display: flex; gap: 12px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
<a href="#s" class="step"><span class="num" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #A3E635; color: #1A2E05; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{ s.n }}</span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700">{{ s.t }}</span><span style="font-size: 13px; line-height: 1.5; color: #5B616B">{{ s.d }}</span></span></a>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">全部指南</h2>
<div style="display: inline-flex; position: relative; background: #FFFFFF; border: 1px solid #E4E4DF; border-radius: 12px; padding: 4px">
<div style="position: absolute; top: 4px; left: 4px; height: 44px; width: 112px; border-radius: 9px; background: #A3E635; transform: translateX({{ tX }}px); transition: transform 220ms cubic-bezier(0.2,0.8,0.2,1)"></div>
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5"><button type="button" class="tab" style="width: 112px" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for>
</div>
</div>
<div style="height: {{ gridH }}px; transition: height 220ms cubic-bezier(0.2,0.8,0.2,1)">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{ items }}" as="g" hint-placeholder-count="6">
<a href="#a" class="card rise{{ gen }}" style="animation-delay: {{ g.delay }}ms">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #F0F0EC; display: inline-flex; align-items: center; justify-content: center; color: #3D4450">
<sc-if value="{{ g.isAcc }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></sc-if>
<sc-if value="{{ g.isPay }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg></sc-if>
<sc-if value="{{ g.isPlan }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg></sc-if>
<sc-if value="{{ g.isCalc }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"></rect><line x1="8" x2="16" y1="6" y2="6"></line><line x1="16" x2="16" y1="14" y2="18"></line><path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"></path></svg></sc-if>
</span>
<span style="font-size: 13px; color: #5B616B">{{ g.cat }}</span>
</div>
<div style="font-size: 18px; font-weight: 700; line-height: 1.4">{{ g.t }}</div>
<div style="font-size: 14px; line-height: 1.6; color: #5B616B; flex-grow: 1">{{ g.d }}</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5B616B"><span><span class="num">{{ g.min }}</span> 分钟 · {{ g.date }}更新</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15171A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></div>
</a>
</sc-for>
</div>
</div>
</section>

<section style="background: #FFFFFF; border-radius: 20px; padding: 22px 26px; display: flex; align-items: center; gap: 20px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D4450" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">没找到你要的？</span><span style="font-size: 14px; color: #5B616B">告诉我们你卡在哪一步，我们会补上对应的指南。</span></div>
<a href="#contact" class="ghost">联系我们</a>
</section>
</main>
<footer style="border-top: 1px solid #E4E4DF; padding: 24px; text-align: center; font-size: 13px; color: #5B616B">页脚与首页相同</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.cats = ['全部', '账号与地区', '付款', '套餐区别', '价格怎么算'];
    this.list = [
      [1, '注册外区 Apple ID', '从准备邮箱到在设备上登录，适用于所有地区。', 5, '11月2日'],
      [1, '切换 Apple ID 地区前要做什么', '余额、订阅和家庭共享会受什么影响，提前处理好。', 4, '10月28日'],
      [1, '切换地区后，原有订阅会怎样', '已订阅的服务会继续到期，还是立刻失效。', 3, '10月25日'],
      [2, '外区账号常见付款方式', '各地区一般接受哪些付款方式，以及常见限制。', 6, '11月1日'],
      [2, '付款被拒的常见原因', '卡种、账单地址和地区不一致时怎么排查。', 4, '10月20日'],
      [2, '美国销售税怎么算', '为什么美国标价和实际扣款不一样。', 3, '10月15日'],
      [3, 'ChatGPT Go、Plus、Pro 有什么区别', '额度、可用模型和适合人群逐项对比。', 6, '11月3日'],
      [3, 'Netflix 各套餐有什么区别', '画质、同时观看人数和广告。', 4, '10月30日'],
      [3, 'YouTube Premium 个人版和家庭版怎么选', '人数、价格和地区限制。', 4, '10月22日'],
      [4, 'GeoSub 的价格从哪来', '采集来源、频率，以及“已核验”的含义。', 3, '11月4日'],
      [4, '汇率怎么换算', '用的是哪天的汇率，为什么和银行扣款有差别。', 3, '11月4日']
    ];
    this.state = { tab: 0, gen: 0 };
  }
  renderVals() {
    const s = this.state;
    const list = this.list.filter((g) => s.tab === 0 || g[0] === s.tab);
    const items = list.map((g, i) => ({ cat: this.cats[g[0]], t: g[1], d: g[2], min: g[3], date: g[4], delay: Math.min(i, 8) * 40,
      isAcc: g[0] === 1, isPay: g[0] === 2, isPlan: g[0] === 3, isCalc: g[0] === 4 }));
    const rowsN = Math.ceil(items.length / 3);
    return {
      steps: [
        { n: 1, t: '注册外区 Apple ID', d: '账号地区决定你能看到哪个价格' },
        { n: 2, t: '准备当地可用的付款方式', d: '不同地区接受的付款方式不一样' },
        { n: 3, t: '比较套餐再订阅', d: '先弄清套餐差别，别多花钱' }
      ],
      tabs: this.cats.map((label, i) => ({ label, on: String(i === s.tab), pick: () => { if (i !== this.state.tab) this.setState({ tab: i, gen: 1 - this.state.gen }); } })),
      tX: s.tab * 112,
      gen: s.gen,
      items,
      gridH: rowsN * 196 + (rowsN - 1) * 16
    };
  }
}
</script>
</body>
</html>
