name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-price-site
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geosub_code_ci
          POSTGRES_USER: geosub
          POSTGRES_PASSWORD: geosub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geosub -d geosub_code_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://geosub:geosub_ci_password@localhost:5432/geosub_code_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use production Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-price-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test collector scheduling and monitoring
        run: node --test ../geosub-backend/scripts/collector-reliability.test.mjs ../geosub-backend/scripts/collector-monitor-database.test.mjs
      - name: Test PostgreSQL existing-cluster guard
        run: node --test ../scripts/tests/postgres-existing-cluster.test.mjs
      - name: Test PostgreSQL guard install and rollback
        run: bash ../scripts/tests/postgres-guard-integration.sh
      - name: Test rolling release safety
        run: node --test ../geosub-backend/deploy/linux-arm64/rolling-release.test.mjs ../geosub-backend/deploy/linux-arm64/component-release.test.mjs
      - name: Prepare build database
        run: npm run db:migrate
      - name: Build
        run: npm run build

  content:
    name: Content quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-price-site
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geosub_content_ci
          POSTGRES_USER: geosub
          POSTGRES_PASSWORD: geosub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geosub -d geosub_content_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://geosub:geosub_ci_password@localhost:5432/geosub_content_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use production Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-price-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Prepare schema for sitemap inspection
        run: npm run db:migrate
      - name: Check source encoding
        run: npm run check:encoding
      - name: Check runtime script migration manifest
        run: npm run check:runtime-scripts
      - name: Test runtime script migration guard
        run: npm run test:runtime-scripts
      - name: Check SEO indexing policy
        run: npm run check:seo
      - name: Check content uniqueness
        run: npm run check:content-uniqueness
      - name: Check sitemap budget
        run: npm run check:sitemap

  database:
    name: Database quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-price-site
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geosub_database_ci
          POSTGRES_USER: geosub
          POSTGRES_PASSWORD: geosub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geosub -d geosub_database_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://geosub:geosub_ci_password@localhost:5432/geosub_database_ci
      GEOSUB_ALLOW_CI_FIXTURE: "true"
      GEOSUB_PRICE_CHECK_PRODUCTS: chatgpt
      GEOSUB_PLAN_CHECK_PRODUCTS: chatgpt
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use production Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-price-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations
        run: npm run db:migrate
      - name: Test automatic identity quarantine and recovery
        env:
          PGPASSWORD: geosub_ci_password
          GEOSUB_IDENTITY_TEST_DATABASE_URL: postgresql://geosub:geosub_ci_password@localhost:5432/geosub_identity_test_ci
        run: |
          createdb --host=localhost --username=geosub geosub_identity_test_ci
          node --test ../geosub-backend/scripts/automatic-identity-lifecycle.test.mjs
      - name: Seed deterministic quality fixture
        run: npm run seed:ci-quality
      - name: Audit migrations
        run: npm run check:migrations
      - name: Check price quality
        run: npm run check:prices
      - name: Check canonical plans
        run: npm run check:plans

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-price-site
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geosub_e2e
          POSTGRES_USER: geosub
          POSTGRES_PASSWORD: geosub_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geosub -d geosub_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://geosub:geosub_ci_password@127.0.0.1:5432/geosub_e2e
      GEOSUB_ANALYTICS_CONSENT_REQUIRED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use production Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-price-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser tests
        run: npm run test:e2e
